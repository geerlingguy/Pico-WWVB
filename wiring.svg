<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" font-family="Helvetica, Arial, sans-serif">
  <rect width="600" height="420" rx="12" fill="#ffffff"/>
  <g fill="none" stroke="#222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Pico 2 W board -->
    <rect x="410" y="24" width="50" height="22" rx="3"/>
    <rect x="360" y="40" width="200" height="344" rx="8"/>
    <rect x="430" y="180" width="60" height="60" rx="3"/>
    <!-- wire from GP0 through resistor to coil -->
    <path d="M374 64 H310 l-5 -6 l-10 12 l-10 -12 l-10 12 l-10 -12 l-10 12 l-10 -12 l-5 6 H130 V206"/>
    <!-- wire from GP1 back to coil -->
    <path d="M374 80 H170 V206"/>
    <!-- loop antenna (several turns) -->
    <circle cx="150" cy="272" r="58"/>
    <circle cx="150" cy="272" r="63"/>
    <circle cx="150" cy="272" r="68"/>
  </g>
  <!-- pin holes -->
  <g fill="#fff" stroke="#222" stroke-width="1.5">
    <circle cx="374" cy="64" r="4" fill="#222"/>
    <circle cx="374" cy="80" r="4" fill="#222"/>
    <circle cx="374" cy="96" r="4"/><circle cx="374" cy="112" r="4"/><circle cx="374" cy="128" r="4"/>
    <circle cx="374" cy="144" r="4"/><circle cx="374" cy="160" r="4"/><circle cx="374" cy="176" r="4"/>
    <circle cx="374" cy="192" r="4"/><circle cx="374" cy="208" r="4"/><circle cx="374" cy="224" r="4"/>
    <circle cx="374" cy="240" r="4"/><circle cx="374" cy="256" r="4"/><circle cx="374" cy="272" r="4"/>
    <circle cx="374" cy="288" r="4"/><circle cx="374" cy="304" r="4"/><circle cx="374" cy="320" r="4"/>
    <circle cx="374" cy="336" r="4"/><circle cx="374" cy="352" r="4"/><circle cx="374" cy="368" r="4"/>
    <circle cx="546" cy="64" r="4"/><circle cx="546" cy="80" r="4"/><circle cx="546" cy="96" r="4"/>
    <circle cx="546" cy="112" r="4"/><circle cx="546" cy="128" r="4"/><circle cx="546" cy="144" r="4"/>
    <circle cx="546" cy="160" r="4"/><circle cx="546" cy="176" r="4"/><circle cx="546" cy="192" r="4"/>
    <circle cx="546" cy="208" r="4"/><circle cx="546" cy="224" r="4"/><circle cx="546" cy="240" r="4"/>
    <circle cx="546" cy="256" r="4"/><circle cx="546" cy="272" r="4"/><circle cx="546" cy="288" r="4"/>
    <circle cx="546" cy="304" r="4"/><circle cx="546" cy="320" r="4"/><circle cx="546" cy="336" r="4"/>
    <circle cx="546" cy="352" r="4"/><circle cx="546" cy="368" r="4"/>
  </g>
  <g fill="#222" font-size="13">
    <text x="435" y="39" font-size="10" text-anchor="middle">USB</text>
    <text x="386" y="68">GP0 · pin 1</text>
    <text x="386" y="84">GP1 · pin 2</text>
    <text x="460" y="275" text-anchor="middle" font-size="15" font-weight="bold">Pico 2 W</text>
    <text x="270" y="44" text-anchor="middle" font-weight="bold">220 Ω</text>
    <text x="150" y="365" text-anchor="middle">loop antenna</text>
    <text x="150" y="382" text-anchor="middle" font-size="11" fill="#555">1–2 m thin insulated wire,</text>
    <text x="150" y="396" text-anchor="middle" font-size="11" fill="#555">20–30 turns, 2–3 cm across</text>
  </g>
</svg>
